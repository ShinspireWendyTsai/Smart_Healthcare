  <script>
    function drawSwimArrows() {
      const wrap = document.getElementById('swimlane');
      const svg  = document.getElementById('swim-svg');
      if (!wrap || !svg) return;
      const W = wrap.offsetWidth;
      const H = wrap.offsetHeight;
      svg.setAttribute('width', W);
      svg.setAttribute('height', H);
      svg.innerHTML = `
        <defs>
          <marker id="ah" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0,9 3.5,0 7" fill="#2f6f4f"/>
          </marker>
          <marker id="ah-d" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0,9 3.5,0 7" fill="#8aab96"/>
          </marker>
        </defs>`;

      const base = wrap.getBoundingClientRect();
      function r(id) {
        const el = document.getElementById(id);
        if (!el) return null;
        const b = el.getBoundingClientRect();
        return {
          l: b.left - base.left, r: b.right - base.left,
          t: b.top  - base.top,  b: b.bottom - base.top,
          mx: b.left - base.left + b.width  / 2,
          my: b.top  - base.top  + b.height / 2
        };
      }

      function line(d, dash) {
        const p = document.createElementNS('http://www.w3.org/2000/svg','path');
        p.setAttribute('d', d);
        p.setAttribute('stroke', dash ? '#8aab96' : '#2f6f4f');
        p.setAttribute('stroke-width', '2.5');
        p.setAttribute('fill', 'none');
        if (dash) p.setAttribute('stroke-dasharray','7 4');
        p.setAttribute('marker-end', dash ? 'url(#ah-d)' : 'url(#ah)');
        svg.appendChild(p);
      }

      /* elbow connector: exit fromSide of A, enter toSide of B */
      function elbow(fId, tId, fSide, tSide, dash) {
        const f = r(fId), t = r(tId);
        if (!f || !t) return;
        const x1 = fSide === 'r' ? f.r : f.l;
        const y1 = f.my;
        const x2 = tSide === 'l' ? t.l : t.r;
        const y2 = t.my;
        const mx = (x1 + x2) / 2;
        line(`M${x1},${y1} L${mx},${y1} L${mx},${y2} L${x2},${y2}`, dash);
      }

      // ?豲?????????謘??
      elbow('c2','p1','r','l',false);  // ????謅????賹??瞏賃??
      elbow('p3','s1','l','r',false);  // ?賹??瞏賃????謢?????插
      elbow('s1','p4','r','l',false);  // ?謢?????插??????蹓魂插
      elbow('p4','c3','l','r',false);  // ?賹??瞏賃???????謅??

      // ??拆??????豲???? (?雓?)
      elbow('s1m','p4','r','l',true);  // ?謢??????????賹??瞏賃??
      elbow('p4m','c3','l','r',true);  // ?賹????拆?????遙??鈭插
    }

    window.addEventListener('load', drawSwimArrows);
