<!DOCTYPE html>
<html lang=zh-TW>
<head>
    <meta charset=UTF-8>
    <meta name=viewport content=width=device-width, initial-scale=1.0>
    <title>訂單列表 - 供應商端管理系統</title>
    <!-- Font Awesome CDN -->
    <link rel=stylesheet href=https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css>
    <!-- 自訂樣式 -->
    <link rel=stylesheet href=css/supplier.css>
</head>
<body>
    <div class=admin-layout>
        <!-- 頂部導覽列 -->
        <header class=top-navbar>
            <div class=navbar-left>
                <div class=navbar-brand>
                    <i class=fas fa-shield-alt></i>
                    <span>智慧照護平台 - 供應商管理系統</span>
                </div>
            </div>
            
            <div class=navbar-right>
                <div class=user-dropdown>
                    <div class=user-avatar>供</div>
                    <div class=user-info>
                        <div class=user-name>春暉藥局</div>
                        <div class=user-role>供應商</div>
                    </div>
                    <button class=btn btn-outline btn-sm onclick=handleLogout()>
                        <i class=fas fa-sign-out-alt></i>
                        登出
                    </button>
                </div>
            </div>
        </header>

        <!-- 主要內容區 -->
        <div class=main-content>
            <!-- 頁面標題 -->
            <div class=page-header>
                <div>
                    <h1 class=page-title>訂單列表</h1>
                    <p class=page-subtitle>查看和管理所有訂單</p>
                </div>
            </div>

            <!-- 篩選工具列 -->
            <div class=card>
                <div class=card-body>
                    <div class=filter-toolbar>
                        <div class=filter-left>
                            <div class=search-box style=width: 300px;>
                                <i class=fas fa-search></i>
                                <input type=text placeholder=搜尋訂單編號、機構名稱... onkeyup=searchTable('orderTable', this.value)>
                            </div>
                            <select class=form-control style=width: 150px;>
                                <option value=">全部狀態</option>
 <option value=pending>待處理</option>
 <option value=confirmed>已確認</option>
 <option value=shipped>已出貨</option>
 <option value=delivered>已送達</option>
 </select>
 <input type=date class=form-control style=width: 150px;>
 <span>至</span>
 <input type=date class=form-control style=width: 150px;>
 </div>
 <div class=filter-right>
 <button class=btn btn-outline>
 <i class=fas fa-filter></i> 進階篩選
 </button>
 <button class=btn btn-outline onclick=exportTableToCSV('orderTable', '訂單列表.csv')>
 <i class=fas fa-download></i> 匯出 Excel
 </button>
 </div>
 </div>
 </div>
 </div>

 <!-- 訂單列表 -->
 <div class=card>
 <div class=card-body>
 <div class=table-responsive>
 <table class=data-table id=orderTable>
 <thead>
 <tr>
 <th><input type=checkbox class=select-all></th>
 <th>訂單編號</th>
 <th>機構名稱</th>
 <th>訂購金額</th>
 <th>訂單日期</th>
 <th>預計出貨</th>
 <th>狀態</th>
 <th>操作</th>
 </tr>
 </thead>
 <tbody>
 <tr>
 <td><input type=checkbox></td>
 <td><a href=supplier-order.html style=color: #3b82f6; text-decoration: none;>#ORD-2026040101</a></td>
 <td>陽光長照中心</td>
 <td>NT,500</td>
 <td>2026/04/20</td>
 <td>2026/04/25</td>
 <td><span class=status-badge style=background: #ffa500; color: white;>待處理</span></td>
 <td>
 <div class=table-actions>
 <button class=btn btn-sm btn-outline>
 <i class=fas fa-eye></i>
 </button>
 </div>
 </td>
 </tr>
 <tr>
 <td><input type=checkbox></td>
 <td><a href=supplier-order.html style=color: #3b82f6; text-decoration: none;>#ORD-2026040102</a></td>
 <td>幸福居家照護</td>
 <td>NT,200</td>
 <td>2026/04/19</td>
 <td>2026/04/24</td>
 <td><span class=status-badge style=background: #27ae60; color: white;>已確認</span></td>
 <td>
 <div class=table-actions>
 <button class=btn btn-sm btn-outline>
 <i class=fas fa-eye></i>
 </button>
 </div>
 </td>
 </tr>
 </tbody>
 </table>
 </div>
 </div>
 </div>
 </div>
 </div>

 <script>
 function handleLogout() {
 if (confirm('確定要登出？')) {
 window.location.href = '#';
 }
 }

 function searchTable(tableId, searchValue) {
 const table = document.getElementById(tableId);
 const rows = table.getElementsByTagName('tbody')[0].getElementsByTagName('tr');
 for (let row of rows) {
 const text = row.innerText.toLowerCase();
 row.style.display = text.includes(searchValue.toLowerCase()) ? '' : 'none';
 }
 }

 function exportTableToCSV(tableId, filename) {
 const table = document.getElementById(tableId);
 let csv = [];
 const headers = [];
 table.querySelectorAll('thead th').forEach(th => {
 headers.push(th.innerText);
 });
 csv.push(headers.join(','));
 table.querySelectorAll('tbody tr').forEach(tr => {
 const cells = [];
 tr.querySelectorAll('td').forEach((td, index) => {
 if (index > 0) cells.push(td.innerText.replace(/,/g, '，'));
 });
 if (cells.length > 0) csv.push(cells.join(','));
 });
 const csvContent = csv.join('\n');
 const link = document.createElement('a');
 link.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent('\uFEFF' + csvContent);
 link.download = filename;
 link.click();
 }

 document.addEventListener('DOMContentLoaded', function() {
 const selectAllCheckbox = document.querySelector('.select-all');
 if (selectAllCheckbox) {
 selectAllCheckbox.addEventListener('change', function() {
 const checkboxes = document.querySelectorAll('tbody input[type=checkbox]');
 checkboxes.forEach(cb => cb.checked = this.checked);
 });
 }
 });
 </script>
 <script src=js/admin.js></script>
</body>
</html>
