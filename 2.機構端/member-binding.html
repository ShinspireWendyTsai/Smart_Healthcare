                </div>
            </div>
            
            <nav class="sidebar-menu">
                <div class="menu-section">
                    <div class="menu-section-title">主要功能</div>
                    
                    <a href="index.html" class="menu-item">
                        <i class="fas fa-tachometer-alt"></i>

                    <div class="menu-item expanded" data-submenu="member-submenu">

                    <div class="submenu show" id="member-submenu">

                    <a href="orders.html" class="menu-item">
                        <i class="fas fa-shopping-cart"></i>

                    </a>
                </div>
                
                <div class="menu-section">
                    <div class="menu-section-title">機構功能</div>
                    
                    <a href="organization.html" class="menu-item">
                        <i class="fas fa-building"></i>
                        <span>機構資訊管理</span>
                    </a>
                    
                    <a href="announcements.html" class="menu-item">
                        <i class="fas fa-bullhorn"></i>
                        <span>機構公告管理</span>
                    </a>
                    
                    <a href="chat.html" class="menu-item">
                        <i class="fas fa-comments"></i>

                    </a>

                    <a href="complaints.html" class="menu-item">

                <div class="menu-section">
                    <div class="menu-section-title">系統管理</div>
                    <div class="menu-item" data-submenu="system-submenu">
                        <i class="fas fa-cog"></i>
                        <span>系統管理</span>

                    <div class="submenu" id="system-submenu">
                        <a href="admins.html" class="menu-item">
                            <span>管理員帳號管理</span>

                            <span>角色權限管理</span>

                        </a>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- 主要內容區 -->
        <div class="main-content">
            <!-- 頂部導覽列 -->
            <header class="top-navbar">
                <div class="navbar-left">
                    <i class="fas fa-bars menu-toggle"></i>
                    <div class="breadcrumb">
                        <a href="index.html">首頁</a>
                        <i class="fas fa-chevron-right"></i>
                        <span>個案會員管理</span>
                        <i class="fas fa-chevron-right"></i>
                        <span>綁定設定</span>
                    </div>
                </div>
                
                <div class="navbar-right">
                    <div class="user-dropdown">
                        <div class="user-avatar">陳</div>
                        <div class="user-info">
                            <div class="user-name">陳小華</div>
                            <div class="user-role">機構管理員</div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- 頁面內容 -->
            <div class="page-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">綁定設定</h1>
                        <p class="page-subtitle">管理機構的綁定碼與 QR Code，讓個案輕鬆綁定您的機構</p>
                    </div>
                </div>

                <!-- 綁定碼設定 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i class="fas fa-keyboard"></i> 綁定碼設定
                        </h3>
                    </div>
                    <div class="card-body">
                        <div class="binding-code-display">
                            <label>目前機構綁定碼</label>
                            <div class="code-box">
                                <span class="code-digit">A</span>
                                <span class="code-digit">B</span>
                                <span class="code-digit">C</span>
                                <span class="code-digit">1</span>
                                <span class="code-digit">2</span>
                                <span class="code-digit">3</span>
                            </div>
                        </div>
                        <div class="code-actions">
                            <button class="btn btn-primary" onclick="regenerateCode()">
                                <i class="fas fa-sync"></i> 重新產生綁定碼
                            </button>
                            <button class="btn btn-outline" onclick="copyCode()">
                                <i class="fas fa-copy"></i> 複製綁定碼
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 綁定設定 -->
                <div class="card" style="display: none; margin-top: 25px;">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i class="fas fa-cog"></i> 綁定流程設定
                        </h3>
                    </div>
                    <div class="card-body">
                        <div class="settings-grid">
                            <div class="setting-item">
                                <div class="setting-info">
                                    <div class="setting-title">需要審核新綁定申請</div>
                                    <div class="setting-desc">開啟後，所有新的綁定申請都需要管理員手動審核後才會生效</div>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="setting-item">
                                <div class="setting-info">
                                    <div class="setting-title">發送綁定通知</div>
                                    <div class="setting-desc">當有新綁定申請或綁定狀態變更時，發送通知給管理員</div>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>

                        <hr style="margin: 25px 0; border: none; border-top: 1px solid #e0e0e0;">

                        <div class="form-row">
                            <div class="form-group" style="flex: 1;">
                                <label>預設關懷者</label>
                                <select class="form-control">
                                    <option value="">請選擇預設關懷者</option>
                                    <option value="1">陳小華</option>
                                    <option value="2">林小美</option>
                                    <option value="3">王大明</option>
                                </select>
                            </div>
                        </div>

                        <div style="text-align: right; margin-top: 20px;">
                            <button class="btn btn-primary">
                                <i class="fas fa-save"></i> 儲存設定
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/admin.js"></script>
    <script>
        function refreshQRCode() {
            if (confirm('確定要重新產生 QR Code 嗎？原有的 QR Code 將會失效。')) {
                alert('QR Code 已重新產生');
            }
        }

        function downloadQRCode() {
            alert('QR Code 下載中...');
        }

        function printQRCode() {
            window.print();
        }

        function regenerateCode() {
            if (confirm('確定要重新產生綁定碼嗎？原有的綁定碼將會失效。')) {
                alert('綁定碼已重新產生');
            }
        }

        function copyCode() {
            navigator.clipboard.writeText('ABC123');
            alert('綁定碼已複製到剪貼簿');
        }

        function generateOneTimeCode() {
            alert('一次性綁定碼已產生：ZZ9999');
        }

        function copyOneTimeCode(code) {
            navigator.clipboard.writeText(code);
            alert('綁定碼 ' + code + ' 已複製到剪貼簿');
        }

        function deleteOneTimeCode(code) {
            if (confirm('確定要刪除此綁定碼嗎？')) {
                alert('綁定碼 ' + code + ' 已刪除');
            }
        }
    </script>
</body>
