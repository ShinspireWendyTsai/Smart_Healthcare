    <!-- JavaScript -->
    <script>
        function openMemberViewModal() {
            document.getElementById('memberViewModal').style.display = 'flex';
        }

        function closeMemberViewModal() {
            document.getElementById('memberViewModal').style.display = 'none';
        }

        let editingRow = null;
        let editingTrigger = null;

        function openMemberEditModal(trigger) {
            editingRow = trigger.closest('tr');
            editingTrigger = trigger;
            const data = trigger.dataset || {};

            const setValue = (id, value) => {
                const field = document.getElementById(id);
                if (field) {
                    field.value = value || '';
                }
            };

            setValue('editMemberId', data.memberId);
            setValue('editMemberName', data.name);
            setValue('editMemberGender', data.gender);
            setValue('editMemberBirth', data.birth);
            setValue('editMemberIdNo', data.idno);
            setValue('editMemberPhone', data.phone);
            setValue('editMemberEmail', data.email);
            setValue('editMemberAddress', data.address);
            setValue('editMemberEmergencyName', data.emergencyName);
            setValue('editMemberEmergencyRelation', data.emergencyRelation);
            setValue('editMemberEmergencyPhone', data.emergencyPhone);
            setValue('editMemberAllergy', data.allergy);
            setValue('editMemberChronicHistory', data.chronicHistory);
            setValue('editMemberOtherNotes', data.otherNotes || data.notes);
            setValue('editMemberStatus', data.status || 'active');

            openModal('editMemberModal');
        }

        function saveMemberEdit() {
            if (!editingRow || !editingTrigger) {
                closeModal('editMemberModal');
                return;
            }

            const name = document.getElementById('editMemberName').value.trim();
            const gender = document.getElementById('editMemberGender').value;
            const birth = document.getElementById('editMemberBirth').value;
            const idNo = document.getElementById('editMemberIdNo').value.trim();
            const phone = document.getElementById('editMemberPhone').value.trim();
            const email = document.getElementById('editMemberEmail').value.trim();
            const address = document.getElementById('editMemberAddress').value.trim();
            const emergencyName = document.getElementById('editMemberEmergencyName').value.trim();
            const emergencyRelation = document.getElementById('editMemberEmergencyRelation').value.trim();
            const emergencyPhone = document.getElementById('editMemberEmergencyPhone').value.trim();
            const allergy = document.getElementById('editMemberAllergy').value.trim();
            const chronicHistory = document.getElementById('editMemberChronicHistory').value.trim();
            const otherNotes = document.getElementById('editMemberOtherNotes').value.trim();
            const status = document.getElementById('editMemberStatus').value;

            const nameEl = editingRow.querySelector('.member-name');
            const avatarEl = editingRow.querySelector('.avatar');
            const phoneCell = editingRow.querySelector('td:nth-child(4)');
            const emailCell = editingRow.querySelector('td:nth-child(5)');
            const statusBadge = editingRow.querySelector('.status-badge');

            if (nameEl && name) {
                nameEl.textContent = name;
            }
            if (avatarEl && name) {
                avatarEl.textContent = name.charAt(0);
            }
            if (phoneCell && phone) {
                phoneCell.textContent = phone;
            }
            if (emailCell && email) {
                emailCell.textContent = email;
            }
            if (statusBadge) {
                const isActive = status === 'active';
                statusBadge.textContent = isActive ? '?鞈對??? : '??踝????;
                statusBadge.classList.toggle('active', isActive);
                statusBadge.classList.toggle('inactive', !isActive);
            }

            editingTrigger.dataset.name = name;
            editingTrigger.dataset.gender = gender;
            editingTrigger.dataset.birth = birth;
            editingTrigger.dataset.idno = idNo;
            editingTrigger.dataset.phone = phone;
            editingTrigger.dataset.email = email;
            editingTrigger.dataset.address = address;
            editingTrigger.dataset.emergencyName = emergencyName;
            editingTrigger.dataset.emergencyRelation = emergencyRelation;
            editingTrigger.dataset.emergencyPhone = emergencyPhone;
            editingTrigger.dataset.allergy = allergy;
            editingTrigger.dataset.chronicHistory = chronicHistory;
            editingTrigger.dataset.otherNotes = otherNotes;
            editingTrigger.dataset.notes = otherNotes;
            editingTrigger.dataset.status = status;

            if (typeof showToast === 'function') {
                showToast('????????踝?雓??, 'success');
            }
            closeModal('editMemberModal');
        }

        document.getElementById('memberViewModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeMemberViewModal();
            }
        });

        document.getElementById('editMemberModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal('editMemberModal');
            }
        });
