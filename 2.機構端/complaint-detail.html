<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>申訴詳情 - 機構端管理系統</title>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 自訂樣式 -->
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .detail-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            align-items: start;
        }

        /* 案件資訊欄位 */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .info-item .info-label { font-size: 12px; color: #999; margin-bottom: 4px; }
        .info-item .info-value { font-size: 14px; font-weight: 600; color: #2c3e50; }

        /* 狀態 / 優先級徽章 */
        .status-badge.replied { background-color: #e0f7f4; color: #16a085; }
        .status-badge.overdue { background-color: #ffeaea; color: #e74c3c; }
        .prio { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .prio.urgent { background: #ffeaea; color: #e74c3c; }
        .prio.high { background: #fff3e0; color: #f39c12; }
        .prio.medium { background: #e3f2fd; color: #3498db; }
        .prio.low { background: #f1f3f5; color: #868e96; }

        .sla-banner {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px; border-radius: 8px; margin-top: 16px; font-size: 14px; font-weight: 600;
        }
        .sla-banner.overdue { background: #ffeaea; color: #e74c3c; }
        .sla-banner.ok { background: #e8f5e9; color: #27ae60; }

        .complaint-body {
            background: #f8f9fa; border-radius: 8px; padding: 16px;
            font-size: 14px; line-height: 1.7; color: #2c3e50;
        }
        .attachment-chip {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 14px; background: #f1f3f5; border-radius: 8px;
            font-size: 13px; color: #495057; margin: 6px 6px 0 0;
        }

        /* 時間軸（移植自客戶端 ticket-detail.html，配色改為 admin 藍/橘） */
        .timeline { display: flex; flex-direction: column; gap: 14px; }
        .timeline-item { display: flex; gap: 12px; align-items: flex-start; }
        .timeline-dot {
            width: 12px; height: 12px; border-radius: 50%; margin-top: 8px; flex-shrink: 0;
            background: #3498db; box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.12);
        }
        .timeline-item.staff .timeline-dot { background: #f39c12; box-shadow: 0 0 0 4px rgba(243, 156, 18, 0.18); }
        .timeline-item.system .timeline-dot { background: #95a5a6; box-shadow: 0 0 0 4px rgba(149, 165, 166, 0.18); }
        .timeline-card {
            flex: 1; background: #fff; border: 1px solid #e9ecef; border-radius: 10px;
            padding: 12px 14px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }
        .timeline-meta {
            display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
            font-size: 13px; color: #6c757d; margin-bottom: 6px;
        }
        .timeline-author { font-weight: 700; color: #2c3e50; }
        .timeline-content { font-size: 14px; color: #2c3e50; line-height: 1.6; }

        @media (max-width: 992px) {
            .detail-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

                                    </div>

                                        <div class="info-label">申訴類型</div>
                                        <div class="info-value" id="caseType">-</div>
                                    </div>
                                    <div class="info-item">
                                        <div class="info-label">優先級</div>
                                        <div class="info-value"><span class="prio" id="casePriority">-</span></div>
                                    </div>

                                        <div class="info-label">建立時間</div>

                                    </div>

                            </div>

                                    <div id="attachmentList"></div>
                                </div>
                            </div>
                        </div>

                        <!-- 處理時間軸 -->

                            <div class="card-header">
                                <h3 class="card-title"><i class="fas fa-stream"></i> 處理進度（全程追蹤）</h3>

                            <div class="card-body">

                            </div>

                                <div class="form-group">
                                    <label>案件狀態</label>
                                    <select class="form-control" id="statusSelect">
                                        <option value="pending">待處理</option>
                                        <option value="processing">處理中</option>
                                        <option value="replied">已回覆</option>
                                    </select>
                                </div>
                                <div class="form-group">

                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>回覆內容（將通知申訴人）</label>

                                </div>
                                <div class="form-group">
                                    <label>內部備註（僅機構內部可見）</label>

                type: '收費爭議',
                priority: 'medium',
                orderId: 'ORD202406100008',

                    { author: '陳專員', role: 'staff', time: '2026/06/15 16:30', content: '已收到您的申訴，正在調閱報價單與帳單明細核對，將於今日內回覆。' }
                ]
            },
            CP202406003: {

                statusClass: 'pending',
                caseName: '張大偉',
                complainant: '張美麗（女）',

                createdAt: '2026/06/10 10:00',

                content: '陪伴服務時數與說明的 4 小時不符，實際僅 3 小時。',

                ]
            },
            CP202406006: {
                subject: '希望提供英文版服務說明',
                statusClass: 'replied',
                caseName: '王小明',
                complainant: '王小明（本人）',
                relation: '本人',
                phone: '0912-345-678',
                type: '其他',
                priority: 'low',
                orderId: '',
                createdAt: '2026/06/08 09:00',
                assignee: '林專員',
                slaOverdue: false,
                slaText: '已於時效內回覆',
                content: '建議提供英文版服務說明文件。',
                attachments: [],
                timeline: [
                    { author: '王小明（本人）', role: 'user', time: '2026/06/08 09:00', content: '提出建議：希望提供英文版服務說明。' },
                    { author: '林專員', role: 'staff', time: '2026/06/08 15:00', content: '感謝建議，已轉為產品優化建議並回覆說明。' }
                ]
            }
        };

        const params = new URLSearchParams(window.location.search);
        const caseId = params.get('id') || 'CP202406001';
        const data = complaintData[caseId] || complaintData.CP202406001;

        // 渲染頁面
        function renderCase() {
            document.getElementById('pageSubject').textContent = data.subject;
            document.getElementById('pageId').textContent = caseId;
            document.getElementById('caseName').textContent = data.caseName;
            document.getElementById('caseComplainant').textContent = data.complainant;
            document.getElementById('casePhone').textContent = data.phone;
            document.getElementById('caseType').textContent = data.type;
            document.getElementById('caseCreated').textContent = data.createdAt;
            document.getElementById('caseAssignee').textContent = data.assignee;
            document.getElementById('complaintBody').textContent = data.content;

            // 狀態徽章
            const statusBadge = document.getElementById('caseStatus');
            statusBadge.className = 'status-badge ' + data.statusClass;
            statusBadge.textContent = STATUS_LABEL[data.statusClass];

            // 優先級
            const prioBadge = document.getElementById('casePriority');
            prioBadge.className = 'prio ' + data.priority;
            prioBadge.textContent = PRIO_LABEL[data.priority];

            // 附件
            const attachWrap = document.getElementById('attachmentWrap');
            const attachList = document.getElementById('attachmentList');
            if (data.attachments && data.attachments.length) {
                attachList.innerHTML = data.attachments.map(function (name) {
                    return '<span class="attachment-chip"><i class="fas fa-paperclip"></i>' + name + '</span>';
                }).join('');
            } else {
                attachWrap.style.display = 'none';
            }

            // 表單初始值
            document.getElementById('statusSelect').value = data.statusClass;
            document.getElementById('assigneeSelect').value = data.assignee;
            document.getElementById('prioSelect').value = data.priority;

            renderTimeline();
        }

        function renderTimeline() {
            document.getElementById('timeline').innerHTML = data.timeline.map(function (record) {
                var roleClass = record.role === 'staff' ? 'staff' : (record.role === 'system' ? 'system' : 'user');
                return '' +
                    '<div class="timeline-item ' + roleClass + '">' +
                        '<div class="timeline-dot"></div>' +
                        '<div class="timeline-card">' +
                            '<div class="timeline-meta">' +
                                '<span class="timeline-author">' + record.author + '</span>' +
                                '<span>' + record.time + '</span>' +
                            '</div>' +
                            '<div class="timeline-content">' + record.content + '</div>' +
                        '</div>' +
                    '</div>';
            }).join('');
        }

        // 目前時間字串 YYYY/MM/DD HH:MM
        function nowStr() {
            var d = new Date();
            var pad = function (n) { return (n < 10 ? '0' : '') + n; };
            return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) +
                ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        // 套用狀態 / 承辦人 / 優先級到畫面
        function applyMeta() {
            var statusVal = document.getElementById('statusSelect').value;
            var assigneeVal = document.getElementById('assigneeSelect').value;
            var prioVal = document.getElementById('prioSelect').value;

            var statusBadge = document.getElementById('caseStatus');
            statusBadge.className = 'status-badge ' + statusVal;
            statusBadge.textContent = STATUS_LABEL[statusVal];

            document.getElementById('caseAssignee').textContent = assigneeVal;

            var prioBadge = document.getElementById('casePriority');
            prioBadge.className = 'prio ' + prioVal;
            prioBadge.textContent = PRIO_LABEL[prioVal];
        }

        function submitReply() {
            var reply = document.getElementById('replyContent').value.trim();
            if (!reply) {
                showToast('請先輸入回覆內容', 'warning');
                return;
            }
            data.timeline.push({ author: '陳小華（機構）', role: 'staff', time: nowStr(), content: reply });
            // 若仍為待處理，送出回覆後自動轉為已回覆
            if (document.getElementById('statusSelect').value === 'pending') {
                document.getElementById('statusSelect').value = 'replied';
            }
            applyMeta();
            renderTimeline();
            document.getElementById('replyContent').value = '';
            showToast('回覆已送出，將通知申訴人', 'success');
        }

        function saveProgress() {
            applyMeta();
            var note = document.getElementById('internalNote').value.trim();
            if (note) {
                data.timeline.push({ author: '系統', role: 'system', time: nowStr(), content: '內部備註：' + note });
                document.getElementById('internalNote').value = '';
                renderTimeline();
            }
            showToast('案件進度已更新', 'success');
        }

        renderCase();
    </script>
</body>
</html>
