    <!-- JavaScript -->
    <script src="js/admin.js"></script>
    <script>
        let currentRelationTagCase = '';
        const caseRelationTagStore = {};

        function notify(message, type = 'success') {
            if (typeof showToast === 'function') {
                showToast(message, type);
                return;
            }
            alert(message);
        }

        function getCurrentChatContext() {
            const chatMainEl = document.querySelector('.chat-main');
            const contactNameEl = document.getElementById('chatHeaderContactName');
            const contactName = contactNameEl ? contactNameEl.textContent.trim() : '';
            const caseName = chatMainEl?.dataset.caseName?.trim() || '?????????';
            const relation = chatMainEl?.dataset.relation?.trim() || '';

            return { caseName, contactName, relation };
        }

        function ensureCaseTags(caseName) {
            if (!caseRelationTagStore[caseName]) {
                caseRelationTagStore[caseName] = [];
            }
        }

        function seedTagFromCurrentContext(caseName) {
            const context = getCurrentChatContext();
            ensureCaseTags(caseName);

            if (caseRelationTagStore[caseName].length === 0 && context.caseName && context.relation) {
                caseRelationTagStore[caseName].push(`${context.caseName}${context.relation}`);
            }
        }

        function renderCaseTagSummary(caseName) {
            const container = document.getElementById('caseRelationTags');
            if (!container) {
                return;
            }

            const tags = caseRelationTagStore[caseName] || [];
            if (tags.length === 0) {
                container.innerHTML = '<span class="relation-tag-empty">?蹎批雓謘???雓??????/span>';
                return;
            }

            container.innerHTML = tags.map(tag => `<span class="relation-tag-chip">${tag}</span>`).join('');
        }

        function renderRelationTagEditList() {
            const listEl = document.getElementById('relationTagEditList');
            if (!listEl) {
                return;
            }

            const tags = caseRelationTagStore[currentRelationTagCase] || [];
            if (tags.length === 0) {
                listEl.innerHTML = '<span class="relation-tag-empty">?蹎批雓謘???????/span>';
                return;
            }

            listEl.innerHTML = tags.map((tag, index) => `
                <span class="relation-tag-chip editable">
                    <span>${tag}</span>
                    <button type="button" class="relation-tag-remove" onclick="removeRelationTag(${index})" aria-label="?謢?雓??雓??">
                        <i class="fas fa-times"></i>
                    </button>
                </span>
            `).join('');
        }

        function openRelationTagModal() {
            const context = getCurrentChatContext();
            currentRelationTagCase = context.caseName;
            seedTagFromCurrentContext(currentRelationTagCase);
            document.getElementById('relationTagCaseName').value = currentRelationTagCase;
            renderRelationTagEditList();
            renderCaseTagSummary(currentRelationTagCase);
            document.getElementById('relationTagModal').style.display = 'flex';

            const input = document.getElementById('relationTagInput');
            if (input) {
                input.value = '';
                input.focus();
            }
        }

        function closeRelationTagModal() {
            document.getElementById('relationTagModal').style.display = 'none';
        }

        function addRelationTag() {
            const input = document.getElementById('relationTagInput');
            const value = input.value.trim();

            if (!value) {
                notify('?嚚???????????, 'warning');
                return;
            }

            ensureCaseTags(currentRelationTagCase);
            const tags = caseRelationTagStore[currentRelationTagCase];

            if (tags.includes(value)) {
                notify('?????????渲洽憛?', 'warning');
                return;
            }

            tags.push(value);
            input.value = '';
            renderRelationTagEditList();
            renderCaseTagSummary(currentRelationTagCase);
        }

        function removeRelationTag(index) {
            const tags = caseRelationTagStore[currentRelationTagCase] || [];
            if (index < 0 || index >= tags.length) {
                return;
            }

            tags.splice(index, 1);
            renderRelationTagEditList();
            renderCaseTagSummary(currentRelationTagCase);
        }

        function saveRelationTags() {
            closeRelationTagModal();
            notify('?雓?????謚??????, 'success');
        }

        // ??????璇????
        document.querySelectorAll('.chat-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });

        document.getElementById('relationTagInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addRelationTag();
            }
        });

        document.getElementById('relationTagModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeRelationTagModal();
            }
        });

        const initContext = getCurrentChatContext();
        seedTagFromCurrentContext(initContext.caseName);
        renderCaseTagSummary(initContext.caseName);
    </script>
